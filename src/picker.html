<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose your Pokémon</title>
<style>
  :root {
    --bg: #f6f3ea; --panel: #ffffff; --ink: #24302b; --muted: #6b766f; --line: #ddd8c8;
    --accent: #e4572e; --accent-ink: #ffffff; --ring: #e4572e33; --tile-hover: #f0ebdb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c211f; --panel: #252b28; --ink: #ecefe9; --muted: #98a39c; --line: #38413c;
      --accent: #ff7a4d; --accent-ink: #1c211f; --ring: #ff7a4d40; --tile-hover: #2d3531;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 15px/1.45 "Segoe UI", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { padding: 22px 24px 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
  h1 { margin: 0 0 2px; font-size: 22px; letter-spacing: -0.01em; }
  .sub { margin: 0 0 14px; color: var(--muted); }
  .bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  #q { flex: 1 1 220px; min-width: 160px; padding: 9px 12px; font: inherit; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
  #q:focus-visible, .tile:focus-visible, .sw:focus-within { outline: 3px solid var(--ring); outline-offset: 1px; }
  .sw { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); cursor: pointer; user-select: none; }
  .sw input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
  main { flex: 1; overflow-y: auto; padding: 18px 24px 24px; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 12px; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 6px 10px;
    background: var(--panel); border: 2px solid var(--line); border-radius: 14px; cursor: pointer;
    font: inherit; color: inherit; text-align: center; }
  .tile:hover { background: var(--tile-hover); }
  .tile[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 4px var(--ring); }
  .tile .pic { width: 100%; aspect-ratio: 1; display: grid; place-items: center; }
  .tile img { width: 100%; height: 100%; object-fit: contain; }
  .tile .ph { width: 38%; aspect-ratio: 1; border-radius: 50%; background: var(--line); opacity: .6;
    animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .tile .ph { animation: none; } }
  .tile .nm { font-weight: 600; }
  .tile .no { font-size: 12px; color: var(--muted); }
  footer { padding: 12px 24px; border-top: 1px solid var(--line); background: var(--panel); color: var(--muted);
    display: flex; justify-content: space-between; gap: 12px; }
  footer b { color: var(--ink); }
  .empty { max-width: 520px; margin: 40px auto; text-align: center; color: var(--muted); }
  .empty code { background: var(--panel); padding: 2px 6px; border-radius: 6px; border: 1px solid var(--line); word-break: break-all; }
</style>
<script type="importmap">
  { "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<style>[hidden]{display:none !important}#form{font:inherit;margin-left:6px;max-width:240px}.load{margin-left:auto;font:inherit;padding:6px 12px;border-radius:8px;border:1px solid #888;background:transparent;color:inherit;cursor:pointer}.load:hover{background:rgba(128,128,128,.2)}</style>
</head>
<body>
<header>
  <h1>Choose your Pokémon</h1>
  <p class="sub">Your pick walks around your desktop. Change it any time from the tray icon.</p>
  <div class="bar">
    <input id="q" type="search" placeholder="Search by name or number" autocomplete="off" aria-label="Search Pokémon">
    <label class="sw"><input type="checkbox" id="shiny"> ✨ Shiny</label>
    <label class="sw" id="formwrap" hidden>Form <select id="form" aria-label="Form"></select></label>
    <button id="load" type="button" class="load">Load model pack…</button>
  </div>
</header>
<main><div id="grid" role="list"></div><div id="empty" class="empty" hidden></div></main>
<footer><span id="status" role="status" aria-live="polite">Pick one to get started.</span><span id="count"></span></footer>
<script type="module" src="./picker.js"></script>
</body>
</html>
